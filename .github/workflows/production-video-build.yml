name: Production Video Build

on:
  push:
    branches:
      - production

jobs:
  render:
    name: Render Remotion videos
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      REMOTION_CONCURRENCY: 2
      # 中文字体和语言环境支持
      LANG: zh_CN.UTF-8
      LC_ALL: zh_CN.UTF-8
      LANGUAGE: zh_CN:zh:en_US:en
      # Puppeteer 中文字体支持
      PUPPETEER_ARGS: "--font-render-hinting=none --disable-font-subpixel-positioning --lang=zh-CN"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnss3 \
            libnspr4 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            fonts-noto-color-emoji \
            fonts-noto-cjk \
            fonts-noto-cjk-extra \
            fonts-wqy-zenhei \
            fonts-wqy-microhei \
            language-pack-zh-hans \
            language-pack-zh-hant
          sudo apt-get install -y --no-install-recommends libasound2 || \
            sudo apt-get install -y --no-install-recommends libasound2t64

      - name: Configure Chinese font support
        run: |
          # 更新字体缓存
          sudo fc-cache -fv
          # 设置中文语言环境
          sudo locale-gen zh_CN.UTF-8 zh_TW.UTF-8
          # 验证中文字体是否正确安装
          fc-list :lang=zh | head -10 || echo "No Chinese fonts found, but continuing..."

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Render video compositions
        run: |
          mkdir -p output/github
          # 设置中文字体渲染参数
          export PUPPETEER_ARGS="--font-render-hinting=none --disable-font-subpixel-positioning --lang=zh-CN --disable-web-security --disable-features=VizDisplayCompositor"
          # 渲染视频组合，支持中文字体
          npx remotion render src/index.tsx BrandAnimation output/github/BrandAnimation.mp4 \
            --codec=h264 --crf=18 --overwrite \
            --browser-args="--font-render-hinting=none --disable-font-subpixel-positioning --lang=zh-CN"
          npx remotion render src/index.tsx Wainting-1 output/github/Wainting-1.mp4 \
            --codec=h264 --crf=18 --overwrite \
            --browser-args="--font-render-hinting=none --disable-font-subpixel-positioning --lang=zh-CN"
          npx remotion render src/index.tsx TodoListPromo output/github/TodoListPromo.mp4 \
            --codec=h264 --crf=18 --overwrite \
            --browser-args="--font-render-hinting=none --disable-font-subpixel-positioning --lang=zh-CN"

      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: production-videos-${{ github.sha }}
          path: output/github
          if-no-files-found: error
          retention-days: 14
